version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing Newman...
      - npm install -g newman
      - echo Installing HTML Reporter...
      - npm install -g newman-reporter-html
  build:
    commands:
      - echo Running Postman collection with environment...
      - newman run SafeSpace_API_Collection.json --environment SafeSpace_environment.json -r cli,html --reporter-html-export newman-report.html

artifacts:
  files:
    - newman-report.html
  discard-paths: yes
  base-directory: .